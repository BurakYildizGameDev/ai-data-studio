[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-studio"
version = "2.0.0"
description = "AI-driven synthetic data generation and multi-stage statistical validation studio."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AI Data Studio Contributors" }
]
keywords = [
    "synthetic-data",
    "data-generation",
    "validation",
    "machine-learning",
    "llm",
    "copula",
    "isolation-forest",
    "data-science"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing :: Mocking"
]
dependencies = [
    "customtkinter>=5.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "faker>=20.0",
    "pyarrow>=14.0",
    "google-genai>=1.0",
    "anthropic>=1.0",
    "ollama>=0.3",
    "requests>=2.31",
    "datasets>=2.16",
    "huggingface_hub>=0.23",
    "psutil>=5.9",
    "keyring>=24.0",
    "tenacity>=8.2",
    "matplotlib>=3.8",
    "pillow>=10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0"
]

[project.scripts]
ai-data-studio = "ai_data_studio.main:main"

[project.urls]
Homepage = "https://github.com/BurakYildizGameDev/ai-data-studio"
Repository = "https://github.com/BurakYildizGameDev/ai-data-studio"
Issues = "https://github.com/BurakYildizGameDev/ai-data-studio/issues"
Documentation = "https://github.com/BurakYildizGameDev/ai-data-studio#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_data_studio*"]

[tool.setuptools.package-data]
# PEP 561: tip stub'lari ve "bu paket tiplenmis" isareti wheel'e girsin.
ai_data_studio = ["py.typed", "*.pyi", "assets/*"]
