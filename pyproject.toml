[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-studio"
version = "2.0.0"
description = "Describe a dataset in plain language; a local LLM writes the contract, the engine generates rows and a validator checks them."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "AI Data Studio Contributors" }
]
keywords = [
    "synthetic-data",
    "data-generation",
    "validation",
    "machine-learning",
    "llm",
    "ollama",
    "copula",
    "isolation-forest",
    "data-science"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing :: Mocking"
]
dependencies = [
    "customtkinter>=5.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "faker>=20.0",
    "pyarrow>=14.0",
    "google-genai>=1.0",
    "anthropic>=1.0",
    "ollama>=0.3",
    "requests>=2.31",
    "datasets>=2.16",
    "huggingface_hub>=0.23",
    "psutil>=5.9",
    "keyring>=24.0",
    "tenacity>=8.2",
    "cryptography>=42.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "reportlab>=4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "pyinstaller>=6.0"
]

[project.scripts]
ai-data-studio = "ai_data_studio.main:main"

[project.urls]
Homepage = "https://github.com/BurakYildizGameDev/ai-data-studio"
Repository = "https://github.com/BurakYildizGameDev/ai-data-studio"
Issues = "https://github.com/BurakYildizGameDev/ai-data-studio/issues"
Documentation = "https://github.com/BurakYildizGameDev/ai-data-studio#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_data_studio*"]
# Test paketi kurulum paketine girmez; testler kaynaktan (git clone) koşulur.
exclude = ["ai_data_studio.tests", "ai_data_studio.tests.*"]

[tool.setuptools.package-data]
# PEP 561: tip stub'lari ve "bu paket tiplenmis" isareti wheel'e girsin.
ai_data_studio = ["py.typed", "*.pyi", "assets/*"]
# Iptal listesi wheel'e GIRMELI: eksik olursa load_revoked_keys() bos kume
# doner ve iptal edilmis anahtarlar kurulu surumde sessizce kabul edilir.
"ai_data_studio.licensing" = ["revoked_keys.json"]
# Modelsiz yolun tamami bu dosyalara bagli: eksik olurlarsa Ollama'si ve
# anahtari olmayan kullanicinin veri uretecek hicbir yolu kalmaz.
"ai_data_studio.templates" = ["*.json"]
